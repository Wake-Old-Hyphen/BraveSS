# ==========================================
# 1. Brave Origin (Stable APK + Stable Patch)
# ==========================================
[Brave-Stable-Origin]
enabled = true
app-name = "brave-browser"
pkg-name = "com.brave.browser"
rv-brand = "morphe"
build-mode = "apk"
arch = "both"
patches-source = "https://revanced-external-bundles.brosssh.com/api/v2/bundle/dh6k/morphe-patches/latest?channel=stable"
patches-source-host = "direct"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://brave-software-brave.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/brave-software/brave-browser"
apkpure-dlurl = "https://apkpure.com/brave-browser-private-ads-block/com.brave.browser"
apkcombo-dlurl = "https://apkcombo.com/brave-browser/com.brave.browser"
github-dlurl = "https://github.com/brave/brave-browser/releases"
patcher-args = """\
  -O"Change app name"="Brave Origin" \
  -O"Custom icon"="assets/isoamoledbraveicon.png" \
  """

